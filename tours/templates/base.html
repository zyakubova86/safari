{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'vendors/bootstrap/css/bootstrap.min.css' %}" media="all">
    <!-- Fonts Awesome CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'vendors/fontawesome/css/all.min.css' %}">
    <!-- jquery-ui css -->
    <link rel="stylesheet" type="text/css" href="{% static 'vendors/jquery-ui/jquery-ui.min.css' %}">
    <!-- modal video css -->
    <link rel="stylesheet" type="text/css" href="{% static 'vendors/modal-video/modal-video.min.css' %}">
    <!-- light box css -->
    <link rel="stylesheet" type="text/css" href="{% static 'vendors/lightbox/dist/css/lightbox.min.css' %}">
    <!-- slick slider css -->
    <link rel="stylesheet" type="text/css" href="{% static 'vendors/slick/slick.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'vendors/slick/slick-theme.css' %}">

    <!-- google fonts -->
    <link href='https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap'
          rel='stylesheet'>
    <!-- Custom CSS -->
    <script src="{% static 'js/jquery.js' %}"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body class="home">
<div id="siteLoader" class="site-loader">
    <div class="preloader-content">
        <img src="{% static 'images/loader1.gif' %}" alt="">
    </div>
</div>
<div id="page" class="full-page">

    <a id="backTotop" href="#" class="to-top-icon">
        <i class="fas fa-chevron-up"></i>
    </a>
    <!-- custom search field html -->
    <div class="header-search-form">
        <div class="container">
            <div class="header-search-container">
                <form class="search-form" role="search" method="get">
                    <input type="text" name="s" placeholder="Enter your text...">
                </form>
                <a href="#" class="search-close">
                    <i class="fas fa-times"></i>
                </a>
            </div>
        </div>
    </div>
    <!-- header html end -->

    {% include 'header.html' %}

    {% block content %}{% endblock %}

    {% include 'footer.html' %}

</div>

<!-- JavaScript -->

<script src="{% static 'js/wayponts.min.js' %}"></script>
<script src="{% static 'vendors/bootstrap/js/bootstrap.min.js' %}"></script>
<script src="{% static 'vendors/jquery-ui/jquery-ui.min.js' %}"></script>
<script src="{% static 'vendors/countdown-date-loop-counter/loopcounter.js' %}"></script>
<script src="{% static 'js/jquery.counterup.js' %}"></script>
<script src="{% static 'vendors/modal-video/jquery-modal-video.min.js' %}"></script>
<script src="{% static 'vendors/masonry/masonry.pkgd.min.js' %}"></script>
<script src="{% static 'vendors/lightbox/dist/js/lightbox.min.js' %}"></script>
<script src="{% static 'vendors/slick/slick.min.js' %}"></script>
<script src="{% static 'js/jquery.slicknav.js' %}"></script>
<script src="{% static 'js/custom.js' %}"></script>
</body>
</html>
